name: CI

# Type-checks both apps and checks the shared packages (portable domain code,
# generated i18n bundles and design-token output up to date, unit tests, the
# request URL contract and the OpenAPI contract) on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx turbo run typecheck
      - run: npx turbo run lint
      - run: npx turbo run test --filter=./packages/*
      - run: npm run check:shared
      - run: npm run check:design
      - run: npm run check:classes

  api-contract:
    # The TypeScript client is checked against contracts/openapi.json; this
    # fails if that file no longer matches the FastAPI routes.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The ephemeris download (-e ./ephemeris_provision) is not needed to build the schema.
      - run: grep -v '^-e ' requirements.txt > /tmp/requirements-schema.txt && pip install -r /tmp/requirements-schema.txt
      - run: python scripts/export_openapi.py --check

  design-parity:
    # Website and the app's web build, same routes, light and dark, phone and
    # desktop. Fails when a page's differing-pixel share is past the threshold.
    # Native font rasterisation is not what this sees; that stays a device check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Compare website and app
        run: |
          npm run dev -w @vedic-patro/web &
          (cd apps/mobile && npx expo start --web --port 8081) &
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:5173 && curl -sf -o /dev/null http://localhost:8081 && break
            sleep 5
          done
          curl -sf -o /dev/null http://localhost:5173
          curl -sf -o /dev/null http://localhost:8081
          npm run check:parity -- --max-diff 0.45
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
