name: CI

# Type-checks both apps and checks the shared packages (portable domain code,
# generated i18n bundles and design-token output up to date, unit tests, the
# request URL contract and the OpenAPI contract), that no inline copy is
# added to the apps, and the API's layer guards, on every push and pull request.
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx turbo run typecheck
      - run: npx turbo run lint
      - run: npx turbo run test --filter=./packages/*
      - run: npm run check:shared
      - run: npm run check:design
      - run: npm run check:classes
      - run: npm run check:copy
      - run: npm run check:duplicates

  api-contract:
    # The TypeScript client is checked against contracts/openapi.json; this
    # fails if that file no longer matches the FastAPI routes.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The ephemeris download (-e ./ephemeris_provision) is not needed to build the schema.
      - run: grep -v '^-e ' requirements.txt > /tmp/requirements-schema.txt && pip install -r /tmp/requirements-schema.txt
      - run: python scripts/export_openapi.py --check

  api-architecture:
    # The API's layer and context-map guards (docs/DDD-PLAN.md) and the unit
    # tests that need neither the ephemeris files nor the city database.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: grep -v '^-e ' requirements.txt > /tmp/requirements-ci.txt && pip install -r /tmp/requirements-ci.txt pytest httpx
      - run: >-
          python -m pytest -q
          tests/test_layer_dependencies.py
          tests/test_context_map.py
          tests/test_profile_rules.py
          tests/test_profiles_api.py
          tests/test_auth_api.py
          tests/test_value_objects.py

  api-tests:
    # The whole API suite. It needs the Swiss ephemeris (.se1, ~95 MB) and the
    # city database (~25 MB), which are downloads rather than repository files;
    # both are fetched the way scripts/deploy.sh fetches them and cached on the
    # scripts that produce them.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      OG_SCREENSHOT: "false"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: grep -v '^-e ' requirements.txt > /tmp/requirements-ci.txt && pip install -r /tmp/requirements-ci.txt pytest httpx
      - uses: actions/cache@v4
        with:
          path: apps/api/data/ephemeris
          key: ephemeris-${{ hashFiles('apps/api/scripts/install_ephemeris.py') }}
      - run: python scripts/install_ephemeris.py --extended
      - uses: actions/cache@v4
        with:
          path: apps/api/data/cities.db
          key: cities-${{ hashFiles('apps/api/scripts/import_cities.py', 'apps/api/services/geography/cities_db.py', 'apps/api/data/cities_db_version') }}
      - run: test -f data/cities.db || python scripts/import_cities.py
      - run: python -m pytest -q
