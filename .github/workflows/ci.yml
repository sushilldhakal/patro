name: CI

# Type-checks both apps and checks the shared packages (portable domain code,
# generated i18n bundles and design-token output up to date, unit tests, the
# request URL contract and the OpenAPI contract), that no inline copy is
# added to the apps, and the Rust API server, on every push and pull request.
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx turbo run typecheck
      - run: npx turbo run lint
      - run: npx turbo run test --filter=./packages/*
      - run: npm run check:shared
      - run: npm run check:design
      - run: npm run check:classes
      - run: npm run check:copy
      - run: npm run check:duplicates

  rust:
    # The Rust server (apps/rust): formatting, clippy with warnings denied, and every crate's
    # tests. The root package's HTTP golden tests need the GeoNames city database and the
    # ephemeris files, which are not in git, so they run on a developer machine and on the
    # test box; this job runs everything that needs no data files.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/rust
      - run: cargo fmt --check
      - run: cargo clippy --workspace --exclude ephemeris --all-targets -- -D warnings
      - run: cargo test --workspace --exclude ephemeris --exclude vedic-patro --no-fail-fast

