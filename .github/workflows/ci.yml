name: CI

# Type-checks both apps and checks the shared packages (portable domain code,
# generated i18n bundles and design-token blocks up to date) on every push and
# pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx turbo run typecheck
      - run: npx turbo run lint --filter=./packages/*
