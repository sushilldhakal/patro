name: Deploy to Oracle VM

# One deploy for the whole monorepo. The website is built here (GitHub Actions), not on the VM,
# and copied over as a tarball; scripts/deploy.sh on the VM then pulls main and deploys only what
# changed: the API (apps/rust) and/or the website (publishes the copied build, no npm on the VM).
# The mobile app ships through EAS, so app-only pushes deploy nothing.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "apps/mobile/**"
      - "**/*.md"

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace=@vedic-patro/web --include-workspace-root --no-audit --no-fund
      - name: Build website
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: /api
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_FACEBOOK_APP_ID: ${{ secrets.VITE_FACEBOOK_APP_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          npm run build
          tar -czf "${GITHUB_WORKSPACE}/web-dist.tgz" -C dist --exclude=./server .

      - name: Copy the website build to the VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: web-dist.tgz
          target: /tmp/patro-web

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          command_timeout: 25m
          script: |
            export WEB_DIST_TGZ=/tmp/patro-web/web-dist.tgz
            bash /home/ubuntu/patro/scripts/deploy.sh

      # www.vedicpatro.com is served by the vedicpatro-web Worker (apps/web/wrangler.jsonc): every
      # page and file from Cloudflare; /api/* and /og-image* have no-Worker routes to the VM. The VM
      # copy published above stays as the rollback (delete the www.vedicpatro.com/* Worker route).
      - name: Deploy website to Cloudflare (Worker static assets)
        working-directory: apps/web
        run: |
          npm run build:pages
          npx --yes wrangler@4 deploy
