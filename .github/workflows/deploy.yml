name: Deploy to Oracle VM

# One deploy for the whole monorepo. scripts/deploy.sh on the VM pulls main and
# deploys only what changed: the API (apps/api) and/or the website (apps/web +
# packages). The mobile app ships through EAS, so app-only pushes deploy nothing.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "apps/mobile/**"
      - "**/*.md"

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          command_timeout: 25m
          script: |
            export VITE_GA_MEASUREMENT_ID="${{ secrets.VITE_GA_MEASUREMENT_ID }}"
            export SENTRY_AUTH_TOKEN="${{ secrets.SENTRY_AUTH_TOKEN }}"
            bash /home/ubuntu/patro/scripts/deploy.sh

  # Website on Cloudflare Pages (project vedicpatro), built here instead of on the VM.
  # Until www's DNS points at Pages this only refreshes vedicpatro.pages.dev; nginx on the VM
  # still serves www (scripts/deploy-web.sh). Skipped while the Cloudflare secrets are unset.
  pages:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: cf
        run: echo "ready=${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.cf.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.cf.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.cf.outputs.ready == 'true'
        run: npm ci --workspace=@vedic-patro/web --include-workspace-root --no-audit --no-fund
      - name: Build
        if: steps.cf.outputs.ready == 'true'
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: /api
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_FACEBOOK_APP_ID: ${{ secrets.VITE_FACEBOOK_APP_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm run build && npm run build:pages
      - name: Deploy to Pages
        if: steps.cf.outputs.ready == 'true'
        working-directory: apps/web
        run: npx --yes wrangler@4 pages deploy dist-pages --project-name=vedicpatro --branch=main --commit-dirty=true
