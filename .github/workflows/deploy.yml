name: Deploy to Oracle VM

# One deploy for the whole monorepo. The website is built here (GitHub Actions), not on the VM,
# the Rust API on GitHub's ARM runner, and only .well-known + redirects.map plus the binary are copied over; scripts/deploy.sh on the VM then deploys what
# changed: the API (apps/rust) and/or those website files. The site itself is served by Cloudflare.
# The mobile app ships through EAS, so app-only pushes deploy nothing.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "apps/mobile/**"
      - "**/*.md"

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  # The Rust API binary, built on GitHub's ARM runner (same Ubuntu 24.04 / aarch64 as the VM) so the
  # VM never compiles. Runs beside the website build; the VM installs it only when apps/rust changed.
  rust:
    # A push whose last commit says [skip deploy] (an app-only release that still touches packages/**)
    # builds and deploys nothing: no Rust binary, no website, no Cloudflare. The deploy job needs this one.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip deploy]') }}
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: apps/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/rust
      - run: cargo build --release -p vedic-patro --locked
      - uses: actions/upload-artifact@v4
        with:
          name: vedic-patro
          path: apps/rust/target/release/vedic-patro
          retention-days: 7

  deploy:
    needs: rust
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace=@vedic-patro/web --include-workspace-root --no-audit --no-fund
      - name: Build website
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: /api
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_FACEBOOK_APP_ID: ${{ secrets.VITE_FACEBOOK_APP_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          npm run build
          # The VM only needs what nginx still serves for vedicpatro.com: app-link files and the 301 map.
          tar -czf "${GITHUB_WORKSPACE}/web-dist.tgz" -C dist .well-known redirects.map

      - uses: actions/download-artifact@v4
        with:
          name: vedic-patro

      - name: Copy the website files and the Rust binary to the VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: web-dist.tgz,vedic-patro
          target: /tmp/patro-web

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          command_timeout: 25m
          script: |
            export WEB_DIST_TGZ=/tmp/patro-web/web-dist.tgz RUST_BIN=/tmp/patro-web/vedic-patro DEPLOY_REF=${{ github.sha }}
            bash /home/ubuntu/patro/scripts/deploy.sh

      # www.vedicpatro.com is served by the vedicpatro-web Worker (apps/web/wrangler.jsonc): every
      # page and file from Cloudflare; /api/* and /og-image* have no-Worker routes to the VM.
      - name: Deploy website to Cloudflare (Worker static assets)
        working-directory: apps/web
        run: |
          npm run build:pages
          npx --yes wrangler@4 deploy
