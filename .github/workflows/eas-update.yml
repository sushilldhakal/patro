name: EAS Update

# Publishes the app's JavaScript to the EAS `preview` channel on every push to
# main that touches the app or the shared packages. Run by hand (Actions -> EAS
# Update -> Run workflow) it can publish to `production` instead: the channel
# App Store / Play Store builds listen on (eas.json), i.e. an OTA to live users
# whose installed build has the same runtime (app version, app.json). A push
# whose last commit message contains [ota production] publishes to production
# too, for when the workflow cannot be started by hand. A preview build installs
# it by itself (lib/use-preview-auto-update.ts); a development build can open
# it from the dev launcher's update list.
#
# Needs the repository secret EXPO_TOKEN (expo.dev → Account settings → Access
# tokens). Only builds made after expo-updates was added can load these
# updates; a change to native code still needs a new build.
on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "package-lock.json"
      - ".github/workflows/eas-update.yml"
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to publish to (production = App Store / Play Store users)
        type: choice
        options: [preview, production]
        default: preview
      message:
        description: Update message shown in EAS
        type: string
        required: false

concurrency:
  group: eas-update-${{ inputs.channel || (contains(github.event.head_commit.message, '[ota production]') && 'production') || 'preview' }}
  cancel-in-progress: true

jobs:
  update:
    # A push whose last commit says [skip mobile] (a web/API-only release) builds and publishes nothing for the apps.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip mobile]') }}
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: nagosi
      SENTRY_PROJECT: patro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci --no-audit --no-fund

      - name: Publish update
        working-directory: apps/mobile
        env:
          # Through the environment, so quotes in a commit message can't break the command.
          MESSAGE: ${{ inputs.message || github.event.head_commit.message || 'Manual run' }}
          CHANNEL: ${{ inputs.channel || (contains(github.event.head_commit.message, '[ota production]') && 'production') || 'preview' }}
        run: >
          eas update
          --channel "$CHANNEL"
          --environment "$CHANNEL"
          --message "$MESSAGE"
          --platform all
          --non-interactive

      # Source maps for the update just published, so a crash in it reads as the original file
      # and line in Sentry. Skipped until the SENTRY_AUTH_TOKEN secret exists.
      - name: Upload update source maps to Sentry
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        working-directory: apps/mobile
        run: npx sentry-expo-upload-sourcemaps dist
