name: EAS Update (preview)

# Publishes the app's JavaScript to the EAS `preview` channel on every push to
# main that touches the app or the shared packages. A preview build installs
# it by itself (lib/use-preview-auto-update.ts); a development build can open
# it from the dev launcher's update list.
#
# Needs the repository secret EXPO_TOKEN (expo.dev → Account settings → Access
# tokens). Only builds made after expo-updates was added can load these
# updates; a change to native code still needs a new build.
on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: eas-update-preview
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT_MOBILE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci --no-audit --no-fund

      - name: Publish update
        working-directory: apps/mobile
        env:
          # Through the environment, so quotes in a commit message can't break the command.
          MESSAGE: ${{ github.event.head_commit.message || 'Manual run' }}
        run: >
          eas update
          --channel preview
          --environment preview
          --message "$MESSAGE"
          --platform all
          --non-interactive

      # Source maps for the update just published, so a crash in it reads as the original file
      # and line in Sentry. Skipped until the SENTRY_AUTH_TOKEN secret exists.
      - name: Upload update source maps to Sentry
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        working-directory: apps/mobile
        run: npx sentry-expo-upload-sourcemaps dist
