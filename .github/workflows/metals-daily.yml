# Gold and silver once a day from FENEGOSIDA (Nepal's gold dealers' federation, the rate shops
# use) to R2 (static.vedicpatro.com/metals/history.json). The apps and the site read that file
# all day; neither they nor the Oracle server ask FENEGOSIDA. FENEGOSIDA posts around 10:40 Nepal
# time, so the 10:30 run may still see yesterday's rate: the 11:30 run replaces it.
name: Metals daily

on:
  schedule:
    - cron: "45 4 * * *" # 10:30 Nepal time
    - cron: "45 5 * * *" # 11:30, after FENEGOSIDA has posted
  workflow_dispatch:

concurrency:
  group: metals-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch today's prices and add them to the history
        run: node scripts/metals-daily.mjs out
      - name: Upload to R2
        run: |
          npx --yes wrangler@4 r2 object put vedicpatro-static/metals/history.json --remote \
            --file out/history.json --content-type "application/json; charset=utf-8" \
            --cache-control "public, max-age=1800"
