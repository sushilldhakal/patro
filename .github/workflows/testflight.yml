name: TestFlight build (preview channel)

# Builds the iOS app with the `testflight` profile and submits it to
# TestFlight. That build follows the EAS `preview` channel, which
# eas-update.yml publishes every push to main to, and it switches to a new
# update as soon as it opens (lib/use-preview-auto-update.ts). So a native
# build is only needed when something native changes: config, dependencies,
# icons and splash, or a manual run from the Actions tab.
#
# The build runs HERE, on a GitHub macOS runner (`eas build --local`), not on
# EAS's build servers, so it does not use the plan's monthly EAS build quota.
# This repository is public, so GitHub-hosted runner minutes are free.
# Only the upload (`eas submit`) goes through EAS.
#
# Never release a `testflight` build to the App Store: it follows `preview`,
# not `production`. Store releases use mobile-release.yml.
#
# Needs the EXPO_TOKEN repository secret. Signing uses the distribution
# certificate and provisioning profile already stored in the project's EAS
# credentials; submission uses the App Store Connect API key stored there too.
on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/app.json"
      - "apps/mobile/app.config.js"
      - "apps/mobile/eas.json"
      - "apps/mobile/package.json"
      - "apps/mobile/assets/icon*"
      - "apps/mobile/assets/splash*"
      - "apps/mobile/plugins/**"
      # Fonts are what a fresh install draws before any update has downloaded.
      - "apps/mobile/assets/fonts/**"
      # A change to how the build is made gets a build to prove it.
      - ".github/workflows/testflight.yml"
  workflow_dispatch:

concurrency:
  group: testflight-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci --no-audit --no-fund

      - name: Build on this runner
        working-directory: apps/mobile
        run: >
          eas build
          --platform ios
          --profile testflight
          --local
          --non-interactive
          --output "$RUNNER_TEMP/vedic-patro-testflight.ipa"

      - name: Submit to TestFlight
        working-directory: apps/mobile
        run: >
          eas submit
          --platform ios
          --profile testflight
          --path "$RUNNER_TEMP/vedic-patro-testflight.ipa"
          --non-interactive
          --wait

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-testflight-${{ github.run_number }}
          path: ${{ runner.temp }}/vedic-patro-testflight.ipa
          if-no-files-found: ignore
          retention-days: 7
