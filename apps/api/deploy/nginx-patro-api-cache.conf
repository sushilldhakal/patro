# nginx response cache in front of FastAPI, included in every location that
# proxies to the API (nginx-vedicpatro.conf). Install:
#   sudo cp deploy/nginx-patro-api-cache.conf /etc/nginx/snippets/patro-api-cache.conf
#
# Why: before this, every request Cloudflare missed went into Python, even when
# Redis already held the answer. Each Redis hit cost a uvicorn request and waited
# on the same event loop (and GIL) as the threads building cold pages, so once a
# few builds ran, cheap hits queued behind them and were shed with 503s. nginx
# answers a cached response in C without touching Python at all.
#
# What is cached is decided by the app, exactly as for Cloudflare: nginx keeps a
# response only when its Cache-Control is public (s-maxage first, then max-age;
# stale-while-revalidate / stale-if-error are honoured). private / no-store /
# no-cache responses, responses with Set-Cookie, responses with no Cache-Control
# at all (accounts, auth, profiles…) and the 503s from the load shedder are never
# stored. No proxy_cache_valid on purpose: it would cache responses the app did
# not mark cacheable.
#
# The zone (patro_api) is defined beside the upstream in nginx-vedicpatro.conf.
# scripts/deploy.sh empties it when the cache epoch or payload version changes,
# and drops edited documents' pages, the same URLs it purges from Cloudflare.

# Caching needs buffering. Streaming responses (/kundali/report NDJSON) send
# X-Accel-Buffering: no, which turns buffering off for that response only.
proxy_buffering on;
proxy_buffer_size 16k;
proxy_buffers 64 16k;
proxy_busy_buffers_size 64k;

proxy_cache patro_api;
# Origin is part of the key: the CORS layer only answers requests that carry an
# Origin header and then adds Access-Control-Allow-Origin, but a request without
# one (the phone app, same-origin web) gets no Vary: Origin. Without it in the key
# a cross-origin browser could be served the phone's copy, which has no CORS
# header. The phone app and same-origin GETs send no Origin, so they share one copy.
proxy_cache_key $host$request_uri|$http_origin;
proxy_cache_methods GET HEAD;
proxy_cache_revalidate on;

# One cold build per URL: identical misses wait for the first one's answer.
proxy_cache_lock on;
proxy_cache_lock_timeout 10s;
proxy_cache_lock_age 15s;

# Expired copy while refreshing in the background, and when the API is down,
# slow or shedding load.
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;

# A signed-in request never reads or fills the shared cache.
proxy_cache_bypass $http_authorization;
proxy_no_cache $http_authorization;

add_header X-Nginx-Cache $upstream_cache_status always;
