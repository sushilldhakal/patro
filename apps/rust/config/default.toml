# Defaults for local development. Every key can be overridden by an environment
# variable: PATRO_RS__<KEY>, e.g. PATRO_RS__PORT=8200.

host = "127.0.0.1"
# 8000, the same port as production (rust.env sets PATRO_RS__PORT=8000 there; the test box uses 8092).
port = 8000
# Reference data (cities.db, documents.db, …) shared with the Python API, opened read-only.
data_dir = "../api/data"
# Matches nginx's proxy_read_timeout for /api/ in front of the Python server.
request_timeout_secs = 15
# tracing filter; RUST_LOG overrides it.
log_filter = "info,tower_http=info"
