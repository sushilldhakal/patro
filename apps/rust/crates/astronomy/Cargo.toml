[package]
name = "astronomy"
description = "Graha positions, frames, rise/set and eclipses by the Surya Siddhanta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Drik positions from the Swiss Ephemeris behind the same `Ephemeris` trait.
drik = ["dep:ephemeris"]

[dependencies]
ephdata.workspace = true
ephemeris = { workspace = true, optional = true }
thiserror.workspace = true
timescale.workspace = true

[dev-dependencies]
criterion.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }

[[bench]]
name = "surya_siddhanta"
harness = false

[lints]
workspace = true
