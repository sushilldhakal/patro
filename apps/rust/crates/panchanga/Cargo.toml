[package]
name = "panchanga"
description = "Tithi, nakshatra, yoga, karana, vara, and when each begins and ends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
astronomy.workspace = true
calendar.workspace = true
common.workspace = true
flate2.workspace = true
rusqlite.workspace = true
serde.workspace = true
# Exact float parsing (as Python's `json`): the persistent day store reads payloads back.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
timescale.workspace = true

[dev-dependencies]
criterion.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }

[[bench]]
name = "daily"
harness = false

[[bench]]
name = "at_time"
harness = false

[lints]
workspace = true
