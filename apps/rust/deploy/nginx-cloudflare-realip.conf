# /etc/nginx/conf.d/cloudflare-realip.conf (http level).
# $remote_addr is the real visitor: CF-Connecting-IP is believed only when the request comes from
# Cloudflare. A request sent straight to the server keeps its own address, so a made-up
# CF-Connecting-IP or X-Forwarded-For cannot pose as many visitors (shared-month votes, rate limits).
# Ranges: https://www.cloudflare.com/ips-v4 and /ips-v6 (2026-11-25).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Sign-in, sign-up and email-link requests: 20 a minute per visitor (burst 20), then 429.
# Only credential POSTs are counted; /auth/me, /auth/refresh and everything else have an empty
# key, which nginx does not count. Generous because many phones share one carrier address (CGNAT).
map "$request_method:$uri" $patro_auth_key {
    "~^POST:(/api)?/auth/(login|signup|google|apple|facebook|forgot-password|reset-password|resend-verification|verify-email)$" $binary_remote_addr;
    default "";
}
limit_req_zone $patro_auth_key zone=patro_auth:10m rate=20r/m;
limit_req_status 429;
