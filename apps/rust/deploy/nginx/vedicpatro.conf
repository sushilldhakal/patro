map $http_user_agent $og_crawler {
    default 0;
    "~*(facebookexternalhit|facebot|twitterbot|slackbot|linkedinbot|whatsapp|telegrambot|discordbot|pinterest|redditbot|skypeuripreview|vkshare|embedly|mastodon|nuzzel)" 1;
}

# Canonical address in one hop (Search Console reported 2-hop chains as "Redirect error"):
#  - $vp_noslash: the request with trailing slashes dropped (query kept), for the apex/http 301s.
#  - $vp_redirect: an old address's new home, from /etc/nginx/vedicpatro-redirects.map, which
#    scripts/deploy-web.sh installs from the build (apps/web/src/lib/app-routes.ts). Before this,
#    those addresses got the home page's HTML with status 200 and a client-side redirect.
map $request_uri $vp_noslash {
    "~^(?<vp_p>/[^?]*[^/?])/+(?<vp_q>\?.*)?$" $vp_p$vp_q;
    default $request_uri;
}
map $uri $vp_uri_noslash {
    "~^(?<vp_u>/.*[^/])/+$" $vp_u;
    default $uri;
}
map $vp_uri_noslash $vp_redirect {
    default "";
    include /etc/nginx/vedicpatro-redirects.map;
}

# /download store button: phones get a 302 straight to their store (see repo deploy/nginx-vedicpatro.conf).
map $http_user_agent $store_redirect {
    default "";
    "~*android" "https://play.google.com/store/apps/details?id=com.vedicpatro.mobile";
    "~*(iphone|ipad|ipod)" "https://apps.apple.com/app/id6820382502";
}

# FastAPI behind one upstream, with idle connections kept open between requests:
# without keepalive every proxied request opened (and left in TIME_WAIT) a new
# TCP connection to uvicorn. keepalive_timeout stays below uvicorn's
# --timeout-keep-alive 30 so nginx always closes an idle connection first.
upstream patro_api {
    server 127.0.0.1:8000;
    keepalive 32;
    keepalive_timeout 20s;
}

# Response cache for the API (rules in /etc/nginx/snippets/patro-api-cache.conf,
# repo: apps/api/deploy/nginx-patro-api-cache.conf).
proxy_cache_path /var/cache/nginx/patro levels=1:2 keys_zone=patro_api:100m
                 max_size=6g inactive=30d use_temp_path=off;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vedicpatro.com;

    ssl_certificate /etc/letsencrypt/live/vedicpatro.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vedicpatro.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    location = /download {
        add_header Cache-Control "private, no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        if ($store_redirect) { return 302 $store_redirect; }
        return 301 https://www.vedicpatro.com/download$is_args$args;
    }

    # App Links / Universal Links: Android and Apple fetch these on the bare host
    # too, and never follow a redirect - serve them here, not via the 301 below.
    location ^~ /.well-known/ {
        root /var/www/vedicpatro;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        if ($vp_redirect) { return 301 https://www.vedicpatro.com$vp_redirect; }
        return 301 https://www.vedicpatro.com$vp_noslash;
    }
}

server {
    server_name www.vedicpatro.com;

    location = /download {
        add_header Cache-Control "private, no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        # On a computer (and for crawlers) this is the home page under another address.
        add_header X-Robots-Tag "noindex" always;
        if ($store_redirect) { return 302 $store_redirect; }
        try_files /index.html =404;
    }

    root /var/www/vedicpatro;
    index index.html;

    # Universal Links (iOS) + App Links (Android): JSON, never index.html.
    location ^~ /.well-known/ {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    client_max_body_size 2m;

    # Whole-year pages are the one family that can legitimately take longer than
    # 15 s to build cold (the warm job builds them ahead of time).
    location ~ ^/api/v1/(panchanga/year/|nepal/(panchak|eclipse/[a-z]+|graha-asta|graha-vakri)/year/) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://patro_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 45s;
        include /etc/nginx/snippets/patro-api-cache.conf;
    }

    # Shared month results (PATRO_RS_SHARED_DIR=/var/lib/patro-shared).
    # GET is a plain file read by nginx: no Rust call and no proxy-cache copy, and Cloudflare keeps
    # the immutable 200s at the edge. Only PUT (a client's vote for a month it computed) reaches Rust.
    location ~ "^/api/v1/shared/month/(?<shared_key>[A-Za-z0-9_.-]{1,96})$" {
        if ($request_method = PUT) { return 418; }
        error_page 418 = @shared_month_put;
        limit_except GET HEAD PUT { deny all; }
        root /var/lib/patro-shared;
        default_type application/json;
        try_files /month/$shared_key.json @shared_month_miss;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location @shared_month_miss {
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        return 404 '{"detail":"not stored"}';
    }
    location @shared_month_put {
        proxy_pass http://patro_api/v1/shared/month/$shared_key;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }
    location /api/ {
        limit_req zone=patro_auth burst=20 nodelay;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_pass http://patro_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Fail fast: a request still unanswered after 15 s is a 504 Cloudflare can
        # cover with its stale copy (stale-if-error), not a minute-long spinner.
        # The work itself finishes and is cached for the next request.
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
        include /etc/nginx/snippets/patro-api-cache.conf;
    }

    location ~* ^/(favicon\.svg|loader\.svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ~* ^/(robots\.txt|sitemap\.xml)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /og-image {
        proxy_pass http://patro_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/patro-api-cache.conf;
    }

 # prefix location (nginx's "if is evil" pitfall).
    location = /panchanga {
        error_page 418 = @og_share;
        if ($og_crawler) { return 418; }
        try_files $uri $uri/index.html /index.html;
    }
    location @og_share {
        rewrite ^ /share/panchanga break;
        proxy_pass http://patro_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        if ($vp_redirect) { return 301 https://www.vedicpatro.com$vp_redirect; }
        rewrite ^/(.+)/$ /$1 permanent;
        try_files $uri $uri/index.html /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vedicpatro.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vedicpatro.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name vedicpatro.com www.vedicpatro.com;
    if ($vp_redirect) { return 301 https://www.vedicpatro.com$vp_redirect; }
    return 301 https://www.vedicpatro.com$vp_noslash;
}
