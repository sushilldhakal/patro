  - id: agni_vasa_236
    title: सैका तिथिवारयुता कृताप्ता
    category: vivah
    source: sait/agni-jurne (Agni-vāsa formula)
    citation: Muhūrta Chintāmaṇi 2.36 [४५८] (Agnyādhāna Prakaraṇa)
    location: src/lib/sait-rules-content.ts
    meter:
    language: sanskrit
    text: |
      सैका तिथिवारयुता कृताप्ता शेषे गुणेऽग्ने भुवि वह्निवासः ।
      सौख्याय होमे शशिगुग्मशेषे प्राणार्थनाशौ दिवि भूतले च ॥ ३६ ॥ [४५८]

  - id: agni_vasa_phala_piyushadhara
    title: तिथिवारयुतिः सैका वेदभक्तावशेषकात्
    category: vivah
    source: sait/agni-jurne (remainder → abode → fruit)
    citation: Muhūrta Chintāmaṇi 2.36 · Pīyūṣadhārā [४५८]
    location: src/lib/sait-rules-content.ts
    meter:
    language: sanskrit
    text: |
      तिथिवारयुतिः सैका वेदभक्तावशेषकात् ।
      निवासोऽग्नेर्व्यौम्नि रूपे वित्तप्राणविनाशकः ॥
      पाताले द्विकशेषेण धनसंचयनाशकः ।
      गुणवेदावशेषेण भूमौ विपुलसौख्यदः ॥ [४५८]

