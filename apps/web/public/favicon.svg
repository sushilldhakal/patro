  <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe6a0" stop-opacity=".9"></stop><stop offset="55%" stop-color="#f4c95e" stop-opacity=".35"></stop><stop offset="100%" stop-color="#f4c95e" stop-opacity="0"></stop></radialGradient>
