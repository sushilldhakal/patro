<style>
  .rays{transform-box:view-box;transform-origin:63.4px 50px;animation:vp-spin 26s linear infinite;}
  .sun{transform-box:view-box;transform-origin:63.4px 50px;animation:vp-pulse 3.4s ease-in-out infinite;}
  .halo{transform-box:view-box;transform-origin:63.4px 50px;animation:vp-glow 3.4s ease-in-out infinite;}
  .crescent{animation:vp-cres 6s ease-in-out infinite;}
  @keyframes vp-spin{to{transform:rotate(360deg);}}
  @keyframes vp-pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
  @keyframes vp-glow{0%,100%{opacity:.4;}50%{opacity:.85;}}
  @keyframes vp-cres{0%,100%{opacity:.92;}50%{opacity:1;}}
  @media (prefers-reduced-motion:reduce){.rays,.sun,.halo,.crescent{animation:none!important;}}
</style>
