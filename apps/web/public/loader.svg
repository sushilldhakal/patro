<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6da8a"/>
      <stop offset=".5" stop-color="#e6b94d"/>
      <stop offset="1" stop-color="#c79126"/>
    </linearGradient>
    <radialGradient id="sun" cx="38%" cy="34%" r="75%">
      <stop offset="0" stop-color="#fbe9b6"/>
      <stop offset=".55" stop-color="#ecc25e"/>
      <stop offset="1" stop-color="#cf9a2c"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe6a0" stop-opacity=".9"/>
      <stop offset="55%" stop-color="#f4c95e" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#f4c95e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e6a6f"/>
      <stop offset="1" stop-color="#073f43"/>
    </linearGradient>
  </defs>
  <style>
    .wrays{transform-box:view-box;transform-origin:50px 50px;animation:vp-spinR 30s linear infinite;}
    .dots{transform-box:view-box;transform-origin:50px 50px;animation:vp-spin 48s linear infinite;}
    .ring2{transform-box:view-box;transform-origin:50px 50px;animation:vp-spinR 60s linear infinite;}
    .sunw{transform-box:view-box;transform-origin:50px 50px;animation:vp-pulse 3.4s ease-in-out infinite;}
    .halow{transform-box:view-box;transform-origin:50px 50px;animation:vp-glow 3.4s ease-in-out infinite;}
    @keyframes vp-spin{to{transform:rotate(360deg);}}
    @keyframes vp-spinR{to{transform:rotate(-360deg);}}
    @keyframes vp-pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
    @keyframes vp-glow{0%,100%{opacity:.4;}50%{opacity:.85;}}
    @media (prefers-reduced-motion:reduce){.wrays,.dots,.ring2,.sunw,.halow{animation:none!important;}}
  </style>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
